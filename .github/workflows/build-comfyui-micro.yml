name: build-comfyui-micro

# Микро-образ: только CUDA + Python (~1.5 ГБ).
# torch + ComfyUI + чекпойнт скачиваются onstart-micro.sh на инстансе.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vast/Dockerfile.comfyui-micro'
      - 'vast/onstart-micro.sh'
      - '.github/workflows/build-comfyui-micro.yml'

env:
  IMAGE: ghcr.io/kirushanetypi/comfyui-micro

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./vast
          file: ./vast/Dockerfile.comfyui-micro
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha

      - name: Размер образа
        run: |
          echo "digest: ${{ steps.build.outputs.digest }}"
          docker pull ${{ env.IMAGE }}:sha-${{ github.sha }} || true
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep comfyui-micro || true

      - name: Smoke test — контейнер стартует
        run: |
          IMG="${{ env.IMAGE }}:sha-${{ github.sha }}"
          docker run -d --name micro-smoke "$IMG"
          sleep 5
          docker ps | grep micro-smoke
          docker rm -f micro-smoke

      - name: Итог
        if: success()
        run: |
          echo "образ опубликован: ${{ env.IMAGE }}:latest"
          echo "размер: ~1.5 ГБ (только CUDA + Python)"
