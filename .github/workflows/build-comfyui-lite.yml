name: build-comfyui-lite

# Лайтовый образ: ComfyUI + CUDA + torch, БЕЗ чекпойнта.
# Чекпойнт докачивается onstart.sh с HuggingFace на инстансе.
# Образ ~5-6 ГБ вместо 13 ГБ → Vast поднимает за 2-3 мин.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vast/Dockerfile.comfyui-lite'
      - 'vast/onstart-lite.sh'
      - '.github/workflows/build-comfyui-lite.yml'

env:
  IMAGE: ghcr.io/kirushanetypi/comfyui-lite

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Освобождаю диск
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
                      /usr/local/.ghcup /usr/lib/jvm || true
          sudo docker image prune -af || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./vast
          file: ./vast/Dockerfile.comfyui-lite
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha

      - name: Размер образа
        run: |
          echo "digest: ${{ steps.build.outputs.digest }}"
          docker pull ${{ env.IMAGE }}:sha-${{ github.sha }} || true
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep comfyui-lite || true

      - name: Smoke test — ComfyUI стартует (CPU, без чекпойнта)
        run: |
          set -eux
          IMG="${{ env.IMAGE }}:sha-${{ github.sha }}"
          docker run -d --name comfy-lite-smoke -p 8188:8188 --entrypoint python3 \
            "$IMG" main.py --cpu --listen 0.0.0.0 --port 8188 --disable-auto-launch
          sleep 30
          curl -sf http://127.0.0.1:8188/system_stats | python3 -c "
          import json,sys; d=json.load(sys.stdin); print('ComfyUI alive:', d.get('system',{}))
          "

      - name: Убираю контейнер
        if: always()
        run: docker rm -f comfy-lite-smoke || true

      - name: Итог
        if: success()
        run: |
          echo "образ опубликован: ${{ env.IMAGE }}:latest"
          echo "digest: ${{ steps.build.outputs.digest }}"
          echo "размер: ~5-6 ГБ (без чекпойнта)"
